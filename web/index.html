<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pylon-synth</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a1410;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Title + one-line help overlay. Mirrors the MIDI overlay's palette
         (bright lime on translucent green-black) so the UI reads as one set. */
      .title-overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        font: 13px system-ui, sans-serif;
        color: #d2ff72;
        background: rgba(10, 20, 16, 0.85);
        border: 1px solid rgba(210, 255, 114, 0.35);
        border-radius: 8px;
        padding: 10px 12px;
        max-width: 260px;
        pointer-events: none;
        user-select: none;
      }
      .title-overlay h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .title-overlay p {
        margin: 0;
        opacity: 0.8;
      }
      /* Footer: GitHub author + repo links. Same palette as the overlays. */
      .footer-overlay {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        font: 12px system-ui, sans-serif;
        color: #d2ff72;
        background: rgba(10, 20, 16, 0.85);
        border: 1px solid rgba(210, 255, 114, 0.35);
        border-radius: 999px;
        padding: 5px 12px 5px 5px;
      }
      .footer-overlay a {
        color: #d2ff72;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .footer-overlay a:hover {
        text-decoration: underline;
      }
      .footer-overlay img {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: block;
      }
      .footer-overlay .sep {
        opacity: 0.4;
      }
    </style>
    <!-- Buildless: three.js from a pinned CDN version via an import map. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="title-overlay">
      <h1>pylon-synth</h1>
      <p>Click and hold a pylon, drag up/down.</p>
    </div>
    <footer class="footer-overlay">
      <a href="https://github.com/juliuszfedyk" target="_blank" rel="noopener">
        <img
          src="https://avatars.githubusercontent.com/u/6018440?v=4&size=64"
          alt="juliuszfedyk"
        />
        juliuszfedyk
      </a>
      <span class="sep">·</span>
      <a href="https://github.com/dannyZyg" target="_blank" rel="noopener">
        <img
          src="https://avatars.githubusercontent.com/u/39764493?v=4&size=64"
          alt="dannyZyg"
        />
        dannyZyg
      </a>
      <span class="sep">·</span>
      <a
        href="https://github.com/openaudiotools/pylon-synth"
        target="_blank"
        rel="noopener"
        aria-label="Source on GitHub"
      >
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"
          ></path>
        </svg>
      </a>
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
