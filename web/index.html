<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pylon-synth</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a1410;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Title + one-line help overlay. Mirrors the MIDI overlay's palette
         (bright lime on translucent green-black) so the UI reads as one set. */
      .title-overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        font: 13px system-ui, sans-serif;
        color: #d2ff72;
        background: rgba(10, 20, 16, 0.85);
        border: 1px solid rgba(210, 255, 114, 0.35);
        border-radius: 8px;
        padding: 10px 12px;
        max-width: 260px;
        pointer-events: none;
        user-select: none;
      }
      .title-overlay h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .title-overlay p {
        margin: 0;
        opacity: 0.8;
      }
      /* Footer: GitHub author + repo links. Same palette as the overlays. */
      .footer-overlay {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        font: 12px system-ui, sans-serif;
        color: #d2ff72;
        background: rgba(10, 20, 16, 0.85);
        border: 1px solid rgba(210, 255, 114, 0.35);
        border-radius: 999px;
        padding: 5px 12px 5px 5px;
      }
      .footer-overlay a {
        color: #d2ff72;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .footer-overlay a:hover {
        text-decoration: underline;
      }
      .footer-overlay img {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: block;
      }
      .footer-overlay .sep {
        opacity: 0.4;
      }
    </style>
    <!-- Buildless: three.js from a pinned CDN version via an import map. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="title-overlay">
      <h1>pylon-synth</h1>
      <p>Click and hold a pylon, drag up/down.</p>
    </div>
    <footer class="footer-overlay">
      <a href="https://github.com/dannyZyg" target="_blank" rel="noopener">
        <img
          src="https://avatars.githubusercontent.com/u/6018440?v=4&size=64"
          alt="dannyZyg"
        />
        dannyZyg
      </a>
      <span class="sep">·</span>
      <a
        href="https://github.com/openaudiotools/pylon-synth"
        target="_blank"
        rel="noopener"
        >repo</a
      >
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
