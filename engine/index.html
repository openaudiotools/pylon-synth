<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Pylon Synth — SuperSonic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 24px;
    }

    #controls {
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .param-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .param-label {
      width: 80px;
      font-size: 0.75rem;
      color: #aaa;
      text-align: right;
      flex-shrink: 0;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #5af;
      cursor: pointer;
    }

    .param-value {
      width: 52px;
      font-size: 0.75rem;
      color: #5af;
      text-align: right;
      flex-shrink: 0;
    }

    #transport {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 8px 20px;
      cursor: pointer;
      letter-spacing: 0.08em;
    }

    button:hover {
      background: #333;
      border-color: #5af;
      color: #5af;
    }

    button.active {
      background: #1a3a4a;
      border-color: #5af;
      color: #5af;
    }

    #status {
      font-size: 0.7rem;
      color: #555;
    }

    #status.ready {
      color: #5a5;
    }

    #status.error {
      color: #a55;
    }

    #status.loading {
      color: #aa5;
    }

    #midi-status {
      font-size: 0.7rem;
      color: #555;
    }

    #midi-status.connected {
      color: #5a5;
    }

    #midi-status.error {
      color: #a55;
    }
  </style>
</head>

<body>
  <h1>Pylon Synth</h1>

  <div id="controls"></div>

  <div id="transport">
    <button id="playBtn">Play</button>
    <span id="status">engine: idle</span>
    <span id="midi-status">MIDI: —</span>
  </div>

  <script type="module">
    import {PylonSynth, PARAM_DEFS} from './pylon-synth.js';

    // ---------------------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------------------
    function norm(v, min, max) {return (v - min) / (max - min);}
    function denorm(n, min, max) {return min + n * (max - min);}
    function fmt(v) {return v < 10 ? v.toFixed(2) : v.toFixed(1);}

    // ---------------------------------------------------------------------------
    // Synth engine
    // ---------------------------------------------------------------------------
    const statusEl = document.getElementById('status');

    const synth = new PylonSynth({
      onStatus(message, className) {
        statusEl.textContent = className;
        statusEl.className = className;
        statusEl.textContent = message;
      },
    });

    // ---------------------------------------------------------------------------
    // Build slider UI
    // ---------------------------------------------------------------------------
    const sliderMap = {};
    const controlsEl = document.getElementById('controls');

    PARAM_DEFS.forEach(([key, label, min, max, def]) => {
      const row = document.createElement('div');
      row.className = 'param-row';

      const lbl = document.createElement('span');
      lbl.className = 'param-label';
      lbl.textContent = label;

      const input = document.createElement('input');
      input.type = 'range';
      input.min = 0;
      input.max = 1000;
      input.value = norm(def, min, max) * 1000;

      const valueEl = document.createElement('span');
      valueEl.className = 'param-value';
      valueEl.textContent = fmt(def);

      input.addEventListener('input', () => {
        const v = denorm(input.value / 1000, min, max);
        valueEl.textContent = fmt(v);
        synth.setParam(key, v);
      });

      row.append(lbl, input, valueEl);
      controlsEl.appendChild(row);
      sliderMap[key] = {input, valueEl, min, max};
    });

    // ---------------------------------------------------------------------------
    // Play / Stop button — boots engine on first press
    // ---------------------------------------------------------------------------
    const playBtn = document.getElementById('playBtn');
    let booting = false;

    playBtn.addEventListener('click', async () => {
      if (synth.isRunning) {
        synth.stop();
        playBtn.textContent = 'Play';
        playBtn.classList.remove('active');
        return;
      }

      if (!synth.isReady) {
        if (booting) return;
        booting = true;
        playBtn.disabled = true;
        try {
          await synth.boot();
        } catch {
          playBtn.disabled = false;
          booting = false;
          return;
        }
        playBtn.disabled = false;
        booting = false;
      }

      synth.start();
      playBtn.textContent = 'Stop';
      playBtn.classList.add('active');
    });

    // ---------------------------------------------------------------------------
    // Web MIDI — CC 1–8 → params
    // ---------------------------------------------------------------------------
    const CC_MAP = {};
    PARAM_DEFS.forEach(([key, , , , , cc]) => {CC_MAP[cc] = key;});

    function applyCC(ccNum, val127) {
      const key = CC_MAP[ccNum];
      if (!key) return;
      const [, , min, max] = PARAM_DEFS.find(p => p[0] === key);
      const v = denorm(val127 / 127, min, max);
      // Update slider UI
      const s = sliderMap[key];
      s.input.value = norm(v, min, max) * 1000;
      s.valueEl.textContent = fmt(v);
      // Forward to engine (also live-updates any active voices)
      synth.setParam(key, v);
    }

    const midiStatus = document.getElementById('midi-status');

    if (navigator.requestMIDIAccess) {
      navigator.requestMIDIAccess().then(access => {
        midiStatus.textContent = 'MIDI: connected';
        midiStatus.className = 'connected';

        function connectInputs() {
          access.inputs.forEach(input => {
            input.onmidimessage = ({data}) => {
              const [status, cc, val] = data;
              if ((status & 0xf0) === 0xb0) applyCC(cc, val);
            };
          });
        }

        connectInputs();
        access.onstatechange = connectInputs;
      }).catch(() => {
        midiStatus.textContent = 'MIDI: permission denied';
        midiStatus.className = 'error';
      });
    } else {
      midiStatus.textContent = 'MIDI: not supported';
      midiStatus.className = 'error';
    }
  </script>
</body>

</html>
